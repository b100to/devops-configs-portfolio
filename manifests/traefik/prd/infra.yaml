---
# Kubecost (kubecost.acme.example) - SSO via oauth2-proxy (reverse proxy mode)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: kubecost
  namespace: kubecost
  labels:
    environment: prd
spec:
  entryPoints:
    - web
  routes:
    # 모든 트래픽을 oauth2-proxy로 라우팅 (SSO 인증 + kubecost 프록시)
    - match: Host(`kubecost.acme.example`)
      kind: Rule
      services:
        - name: kubecost-oauth2-proxy
          port: 4180
      middlewares:
        - name: company-ip-allowlist
          namespace: traefik

