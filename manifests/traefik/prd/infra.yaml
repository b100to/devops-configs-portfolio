---
# Argo Workflows SSO auto-redirect: unauthenticated root → SSO
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: argo-sso-redirect
  namespace: argo
spec:
  redirectRegex:
    regex: ".*"
    replacement: "https://argo-workflows.acme.example/oauth2/redirect?redirect=/"
    permanent: false

---
# Argo Workflows
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argo-workflows
  namespace: argo
  labels:
    environment: prd
spec:
  entryPoints:
    - web
  routes:
    # Authenticated (has authorization cookie): pass through directly
    - match: Host(`argo-workflows.acme.example`) && HeaderRegexp(`Cookie`, `authorization=`)
      kind: Rule
      priority: 20
      services:
        - name: argo-workflows-server
          port: 2746
      middlewares:
        - name: company-ip-allowlist
          namespace: traefik
    # Unauthenticated root path: auto-redirect to SSO
    - match: Host(`argo-workflows.acme.example`) && Path(`/`)
      kind: Rule
      priority: 15
      services:
        - name: argo-workflows-server
          port: 2746
      middlewares:
        - name: company-ip-allowlist
          namespace: traefik
        - name: argo-sso-redirect
          namespace: argo
    # All other paths (oauth2/*, api/*, assets, etc.)
    - match: Host(`argo-workflows.acme.example`)
      kind: Rule
      priority: 10
      services:
        - name: argo-workflows-server
          port: 2746
      middlewares:
        - name: company-ip-allowlist
          namespace: traefik

