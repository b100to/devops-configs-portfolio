# =============================================================================
# Infrastructure & Tools Routes - Production
# argocd, grafana, kafka, traefik, homepage, airflow, authentik
# =============================================================================

---
# Authentik SSO
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: authentik
  namespace: authentik
  labels:
    environment: prd
spec:
  entryPoints:
    - web
  routes:
    # OIDC public endpoints (JWKS, discovery) - AWS STS must access these to verify tokens
    - match: Host(`sso.acme.example`) && (PathPrefix(`/application/o/aws-cli/jwks`) || PathPrefix(`/application/o/aws-cli/.well-known`))
      kind: Rule
      services:
        - name: authentik-server
          port: 80
      priority: 30
    # OIDC backchannel/public endpoints for ArgoCD/Grafana/Airflow/Argo Workflows
    # NOTE: token/userinfo are called server-to-server from app pods (not end-user browser IP)
    - match: Host(`sso.acme.example`) && (PathPrefix(`/application/o/token/`) || Path(`/application/o/token`) || PathPrefix(`/application/o/userinfo/`) || Path(`/application/o/userinfo`) || PathPrefix(`/application/o/argocd/jwks`) || PathPrefix(`/application/o/argocd/.well-known`) || PathPrefix(`/application/o/grafana/jwks`) || PathPrefix(`/application/o/grafana/.well-known`) || PathPrefix(`/application/o/argo-workflows/jwks`) || PathPrefix(`/application/o/argo-workflows/.well-known`) || PathPrefix(`/application/o/kubecost/jwks`) || PathPrefix(`/application/o/kubecost/.well-known`) || PathPrefix(`/application/o/outline/jwks`) || PathPrefix(`/application/o/outline/.well-known`) || PathPrefix(`/application/o/airflow-green/jwks`) || PathPrefix(`/application/o/airflow-green/.well-known`))
      kind: Rule
      services:
        - name: authentik-server
          port: 80
      priority: 25
    # OIDC endpoints - authorize/token accessed from company IP via browser
    - match: Host(`sso.acme.example`) && PathPrefix(`/application/o/`)
      kind: Rule
      services:
        - name: authentik-server
          port: 80
      middlewares:
        - name: company-ip-allowlist
          namespace: traefik
      priority: 20
    - match: Host(`sso.acme.example`)
      kind: Rule
      services:
        - name: authentik-server
          port: 80
      middlewares:
        - name: company-ip-allowlist
          namespace: traefik

