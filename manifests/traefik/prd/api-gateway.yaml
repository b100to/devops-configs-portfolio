  routes:
    # beacon-api
    - match: (Host(`api.acme.example`) || Host(`apiv3.acme.example`) || Host(`api.acmemall.example`)) && PathPrefix(`/admin/registration`)
      kind: Rule
      middlewares:
        - name: cors-headers
          namespace: traefik
      services:
        - name: beacon-api
          port: 80
      priority: 30

    - match: (Host(`api.acme.example`) || Host(`apiv3.acme.example`) || Host(`api.acmemall.example`)) && PathPrefix(`/beacon-api`)
      kind: Rule
      middlewares:
        - name: cors-headers
          namespace: traefik
      services:
        - name: beacon-api
