# =============================================================================
# API Gateway Routes - Production
# api, apiv3, api.acmemall.example 라우팅 설정
# =============================================================================

---
# /h/* 라우트 (prefix rewrite 필요)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: api-gateway-h-routes
  namespace: venue
  labels:
    environment: prd
spec:
  entryPoints:
    - web
  routes:
    # beacon-api
    - match: (Host(`api.acme.example`) || Host(`apiv3.acme.example`) || Host(`api.acmemall.example`)) && PathPrefix(`/h/admin/registration`)
      kind: Rule
      middlewares:
        - name: strip-h-prefix
          namespace: venue
        - name: cors-headers
          namespace: traefik
      services:
        - name: beacon-api
          port: 80
      priority: 40

    - match: (Host(`api.acme.example`) || Host(`apiv3.acme.example`) || Host(`api.acmemall.example`)) && PathPrefix(`/h/beacon-api`)
      kind: Rule
      middlewares:
        - name: strip-h-prefix
          namespace: venue
        - name: cors-headers
          namespace: traefik
      services:
        - name: beacon-api
          port: 80
      priority: 40

    - match: (Host(`api.acme.example`) || Host(`apiv3.acme.example`) || Host(`api.acmemall.example`)) && PathPrefix(`/h/beacon`)
      kind: Rule
      middlewares:
        - name: strip-h-prefix
          namespace: venue
        - name: cors-headers
          namespace: traefik
      services:
        - name: beacon-api
          port: 80
      priority: 40

    # user-api
    - match: (Host(`api.acme.example`) || Host(`apiv3.acme.example`) || Host(`api.acmemall.example`)) && PathPrefix(`/h/users/by-token`)
      kind: Rule
      middlewares:
        - name: strip-h-prefix
          namespace: venue
        - name: cors-headers
          namespace: traefik
      services:
        - name: user-api
          port: 80
      priority: 40

    # member-api
    - match: (Host(`api.acme.example`) || Host(`apiv3.acme.example`) || Host(`api.acmemall.example`)) && PathPrefix(`/h/member-admin`)
      kind: Rule
      middlewares:
        - name: strip-h-prefix
          namespace: venue
        - name: cors-headers
          namespace: traefik
      services:
        - name: member-api
          port: 80
      priority: 40

    - match: (Host(`api.acme.example`) || Host(`apiv3.acme.example`) || Host(`api.acmemall.example`)) && PathPrefix(`/h/members`)
      kind: Rule
      middlewares:
        - name: strip-h-prefix
          namespace: venue
        - name: cors-headers
          namespace: traefik
      services:
        - name: member-api
          port: 80
      priority: 40

    - match: (Host(`api.acme.example`) || Host(`apiv3.acme.example`) || Host(`api.acmemall.example`)) && PathPrefix(`/h/member`)
      kind: Rule
      middlewares:
        - name: strip-h-prefix
          namespace: venue
        - name: cors-headers
          namespace: traefik
      services:
        - name: member-api
          port: 80
      priority: 40

---
# 일반 라우트 (prefix rewrite 없음)
