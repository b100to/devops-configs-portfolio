          namespace: mall
          port: 80
      priority: 30

    # member-api
    - match: (Host(`api.acme.example`) || Host(`apiv3.acme.example`) || Host(`api.acmemall.example`)) && PathPrefix(`/member-admin`)
      kind: Rule
      middlewares:
        - name: cors-headers
          namespace: traefik
      services:
        - name: member-api
          port: 80
      priority: 30

    - match: (Host(`api.acme.example`) || Host(`apiv3.acme.example`) || Host(`api.acmemall.example`)) && PathPrefix(`/members`)
      kind: Rule
      middlewares:
        - name: cors-headers
          namespace: traefik
      services:
        - name: member-api
          port: 80
      priority: 30

    - match: (Host(`api.acme.example`) || Host(`apiv3.acme.example`) || Host(`api.acmemall.example`)) && PathPrefix(`/member`)
      kind: Rule
      middlewares:
        - name: cors-headers
          namespace: traefik
      services:
        - name: member-api
          port: 80
      priority: 30

---
# Prefix Rewrite 라우트 (prefix 완전 제거)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: api-gateway-rewrite-routes
  namespace: venue
  labels:
    environment: prd
spec:
  entryPoints:
    - web
  routes:
    # studio-user-api (/partner/ -> /)
    - match: (Host(`api.acme.example`) || Host(`apiv3.acme.example`) || Host(`api.acmemall.example`)) && PathPrefix(`/partner`)
      kind: Rule
      middlewares:
        - name: strip-partner-prefix
          namespace: venue
        - name: cors-headers
          namespace: traefik
      services:
        - name: studio-user-api
          port: 80
      priority: 20

    # play-api (/play/ -> /)
    - match: (Host(`api.acme.example`) || Host(`apiv3.acme.example`) || Host(`api.acmemall.example`)) && PathPrefix(`/play`)
      kind: Rule
      middlewares:
        - name: strip-play-prefix
          namespace: venue
        - name: cors-headers
          namespace: traefik
      services:
        - name: play-api
          port: 80
      priority: 20

    # ins-api (/sc-ins/ -> /)
    - match: (Host(`api.acme.example`) || Host(`apiv3.acme.example`) || Host(`api.acmemall.example`)) && PathPrefix(`/sc-ins`)
      kind: Rule
      middlewares:
        - name: strip-sc-ins-prefix
          namespace: venue
        - name: cors-headers
          namespace: traefik
      services:
        - name: ins-api
          port: 80
      priority: 20
