      priority: 30

    - match: (Host(`api.acme.example`) || Host(`apiv3.acme.example`) || Host(`api.acmemall.example`)) && PathPrefix(`/beacon`)
      kind: Rule
      middlewares:
        - name: cors-headers
          namespace: traefik
