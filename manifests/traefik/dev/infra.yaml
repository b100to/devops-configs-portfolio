---
# Argo Workflows SSO auto-redirect: unauthenticated root → SSO
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: argo-sso-redirect
  namespace: argo
spec:
  redirectRegex:
    regex: ".*"
    replacement: "https://argo-workflows.dev.acme.example/oauth2/redirect?redirect=/"
    permanent: false

---
# Argo Workflows (argo-workflows.dev.acme.example)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argo-workflows
  namespace: argo
  labels:
    environment: dev
spec:
  entryPoints:
    - web
  routes:
    # Authenticated (has authorization cookie): pass through directly
    - match: Host(`argo-workflows.dev.acme.example`) && HeaderRegexp(`Cookie`, `authorization=`)
      kind: Rule
      priority: 20
      services:
        - name: argo-workflows-server
          port: 2746
      middlewares:
        - name: company-ip-allowlist
          namespace: traefik
    # Unauthenticated root path: auto-redirect to SSO
    - match: Host(`argo-workflows.dev.acme.example`) && Path(`/`)
      kind: Rule
      priority: 15
      services:
        - name: argo-workflows-server
          port: 2746
      middlewares:
        - name: company-ip-allowlist
          namespace: traefik
        - name: argo-sso-redirect
          namespace: argo
    # All other paths (oauth2/*, api/*, assets, etc.)
    - match: Host(`argo-workflows.dev.acme.example`)
      kind: Rule
      priority: 10
      services:
        - name: argo-workflows-server
          port: 2746
      middlewares:
        - name: company-ip-allowlist
          namespace: traefik

---
# Traefik Dashboard (traefik.dev.acme.example)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: traefik-dashboard
  namespace: traefik
  labels:
    environment: dev
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`traefik.dev.acme.example`)
      kind: Rule
      services:
        - name: api@internal
          kind: TraefikService
      middlewares:
        - name: company-ip-allowlist
          namespace: traefik

---
# Company Items (company-supply.dev.acme.example)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: company-items
  namespace: company-items
  labels:
    environment: dev
spec:
  entryPoints:
    - web
  routes:
    # /api/ -> backend-service
    - match: Host(`company-supply.dev.acme.example`) && PathPrefix(`/api/`)
      kind: Rule
      services:
        - name: backend-service
          port: 8080
      middlewares:
        - name: company-ip-allowlist
          namespace: traefik
      priority: 20

    # / -> frontend-service (catch-all)
    - match: Host(`company-supply.dev.acme.example`)
      kind: Rule
      services:
        - name: frontend-service
          port: 80
      middlewares:
        - name: company-ip-allowlist
          namespace: traefik
      priority: 10

---
# Homepage (dev.acme-corp.example)
apiVersion: traefik.io/v1alpha1
