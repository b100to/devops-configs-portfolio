# =============================================================================
# Infrastructure & Tools Routes - Development
# argocd, grafana, kafka, traefik, company-supply, homepage
# =============================================================================

---
# ArgoCD (argocd.dev.acme.example)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argocd-server
  namespace: argocd
  labels:
    environment: dev
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`argocd.dev.acme.example`)
      kind: Rule
      services:
        - name: argocd-server
          port: 80
      middlewares:
        - name: company-ip-allowlist
          namespace: traefik

---
# Grafana (grafana.dev.acme.example)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana
  namespace: monitoring
  labels:
    environment: dev
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`grafana.dev.acme.example`)
