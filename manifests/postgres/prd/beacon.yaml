# Beacon (acme-beacon-pg) PostgreSQL Proxy
# 타겟은 stable CNAME(beacon-db.acme.example → acme-beacon-pg RDS). RDS 엔드포인트 변경 시 Route53만 갱신.
# 주의: acme-beacon-pg 클러스터는 현재 인스턴스 0개(휴면, 백업 볼륨). 인스턴스 기동 시 자동으로 접속 가능.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: beacon-pg-proxy
  namespace: default
  labels:
    app: beacon-pg-proxy
    service: beacon
    component: pg-proxy
spec:
  serviceName: beacon-pg-service
  replicas: 1
  selector:
    matchLabels:
      app: beacon-pg-proxy
  template:
    metadata:
      labels:
        app: beacon-pg-proxy
        service: beacon
        component: pg-proxy
    spec:
      containers:
        - name: pg-proxy
          image: alpine/socat
          command:
            - socat
            - TCP-LISTEN:5432,fork,reuseaddr
            - TCP:beacon-db.acme.example:5432
          ports:
            - containerPort: 5432
              name: postgres
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE
      tolerations:
        - key: "node-group-type"
          operator: "Equal"
          value: "base"
          effect: "NoSchedule"

---
# Beacon PostgreSQL Service
apiVersion: v1
kind: Service
metadata:
  name: beacon-pg-service
  namespace: default
  labels:
    app: beacon-pg-proxy
    service: beacon
spec:
  selector:
    app: beacon-pg-proxy
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
  type: ClusterIP
