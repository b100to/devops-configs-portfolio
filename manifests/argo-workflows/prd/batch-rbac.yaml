# =============================================================================
# Argo Workflows RBAC - batch namespace (prd)
# CronWorkflow executor pods가 batch 네임스페이스에서 실행될 수 있도록
# workflowDefaults.spec.serviceAccountName: argo-workflow 설정과 함께 사용
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argo-workflow
  namespace: batch
---
# K8s 1.24+: SA 토큰 시크릿이 자동 생성되지 않으므로 명시적으로 생성
apiVersion: v1
kind: Secret
metadata:
  name: argo-workflow.service-account-token
  namespace: batch
  annotations:
    kubernetes.io/service-account.name: argo-workflow
type: kubernetes.io/service-account-token
---
# Argo HTTP template agent가 필요한 권한
# - workflowtasksets: watch (controller로부터 HTTP task 수신)
# - workflowtaskresults: create/patch (task 실행 결과 보고)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argo-workflow
  namespace: batch
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["workflowtasksets"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["argoproj.io"]
    resources: ["workflowtasksets/status"]
    verbs: ["patch"]
  - apiGroups: ["argoproj.io"]
    resources: ["workflowtaskresults"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argo-workflow
  namespace: batch
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argo-workflow
subjects:
  - kind: ServiceAccount
    name: argo-workflow
    namespace: batch
