# plane-app-secrets 대체 Secret (external_secrets.app_env_existingSecret 참조)
# chart가 CSRF_TRUSTED_ORIGINS를 지원하지 않아 커스텀 Secret으로 주입
# Secret이 ConfigMap(plane-app-vars)보다 후순위로 envFrom 로드되므로 WEB_URL도 여기서 오버라이드

apiVersion: v1
kind: Secret
metadata:
  name: plane-app-secrets-custom
  namespace: tools
type: Opaque
stringData:
  SECRET_KEY: "REPLACE_ME_SECRET_KEY"
  LIVE_SERVER_SECRET_KEY: "REPLACE_ME_LIVE_SERVER_SECRET_KEY"
  REDIS_URL: "redis://plane-redis.tools.svc.cluster.local:6379/"
  DATABASE_URL: "postgresql://plane:plane@plane-pgdb.tools.svc.cluster.local/plane"
  AMQP_URL: "amqp://plane:plane@plane-rabbitmq.tools.svc.cluster.local/"
  CSRF_TRUSTED_ORIGINS: "https://plane.dev.acme.example"
  WEB_URL: "https://plane.dev.acme.example"  # chart ConfigMap의 http://plane.example.com 오버라이드
