# plane-doc-store-secrets 대체 Secret
# external_secrets.doc_store_existingSecret 참조
#
# MINIO_SERVER_URL: MinIO가 reverse proxy(Traefik) 뒤에서 동작할 때 공개 URL을 알아야
# presigned URL 서명 검증이 올바르게 동작함.
# 미설정 시 MinIO가 내부 URL로 서명 검증 → 403 Forbidden 반환

apiVersion: v1
kind: Secret
metadata:
  name: plane-doc-store-custom
  namespace: tools
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: admin
  AWS_SECRET_ACCESS_KEY: REPLACE_ME
  AWS_S3_BUCKET_NAME: uploads
  AWS_S3_ENDPOINT_URL: http://plane-minio:9000
  FILE_SIZE_LIMIT: "5242880"
  MINIO_ROOT_USER: admin
  MINIO_ROOT_PASSWORD: REPLACE_ME
  USE_MINIO: "1"
  MINIO_SERVER_URL: https://plane.dev.acme.example  # presigned URL 서명 검증용 공개 URL
