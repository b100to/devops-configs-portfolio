# Plane Google OAuth ExternalSecret
#
# configure_instance 커맨드는 Pod 최초 기동 시 GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET
# 환경변수를 읽어 DB(InstanceConfiguration)에 초기값을 자동 설정.
# → IS_GOOGLE_ENABLED=1 자동 설정됨 (별도 Django shell 작업 불필요)
#
# dev 현재 상태:
#   - DB에 직접 입력된 값이 있으므로 이 ExternalSecret은 부가적 역할
#   - DB가 초기화될 경우 configure_instance가 이 시크릿의 값을 읽어 재구성
#
# ⚠️ prd 신규 배포 시 필수 작업:
#   1. eks/acme-main-v2-prd SM에 plane_google_client_id, plane_google_client_secret 추가
#   2. prd ExternalSecret에서 아래와 같이 plane-app-secrets-custom을 target으로 설정
#      (chart는 app_env_existingSecret 하나만 지원하므로 모든 env를 하나의 Secret에 포함)
#   3. Google Cloud Console에 redirect URI 등록:
#      https://plane.acme.example/auth/google/callback/
#
# prd ExternalSecret 예시 (manifests/plane/prd/external-secret.yaml):
# ---
# spec:
#   target:
#     name: plane-app-secrets-custom  # ← static Secret 대신 ExternalSecret이 생성
#   data:
#     - secretKey: GOOGLE_CLIENT_ID
#       remoteRef: { key: eks/acme-main-v2-prd, property: plane_google_client_id }
#     - secretKey: GOOGLE_CLIENT_SECRET
#       remoteRef: { key: eks/acme-main-v2-prd, property: plane_google_client_secret }
#     - secretKey: SECRET_KEY
#       remoteRef: { key: eks/acme-main-v2-prd, property: plane_secret_key }
#     - secretKey: LIVE_SERVER_SECRET_KEY
#       remoteRef: { key: eks/acme-main-v2-prd, property: plane_live_server_secret_key }
#     - secretKey: CSRF_TRUSTED_ORIGINS
#       remoteRef: { key: eks/acme-main-v2-prd, property: plane_csrf_trusted_origins }
#     - secretKey: WEB_URL
#       remoteRef: { key: eks/acme-main-v2-prd, property: plane_web_url }

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: plane-google-oauth
  namespace: tools
spec:
  refreshInterval: "15m"
  secretStoreRef:
    name: aws-secrets-store
    kind: ClusterSecretStore
  target:
    name: plane-google-oauth
    creationPolicy: Owner
  data:
    - secretKey: GOOGLE_CLIENT_ID
      remoteRef:
        key: eks/acme-main-v2-dev
        property: plane_google_client_id
    - secretKey: GOOGLE_CLIENT_SECRET
      remoteRef:
        key: eks/acme-main-v2-dev
        property: plane_google_client_secret
