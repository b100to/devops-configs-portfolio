# Secrets Manager 참조:
#   outline/prd              : SECRET_KEY, UTILS_SECRET, DATABASE_URL, DB_PASSWORD (Terraform 관리)
#   eks/acme-main-v2-prd   : outline_oidc_client_secret (수동 관리, 다른 OAuth 시크릿과 통일)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: outline-secrets
  namespace: outline
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: "15m"
  secretStoreRef:
    name: aws-secrets-store
    kind: ClusterSecretStore
  target:
    name: outline-secrets
    creationPolicy: Owner
  data:
    - secretKey: SECRET_KEY
      remoteRef:
        key: outline/prd
        property: SECRET_KEY
    - secretKey: UTILS_SECRET
      remoteRef:
        key: outline/prd
        property: UTILS_SECRET
    - secretKey: DATABASE_URL
      remoteRef:
        key: outline/prd
        property: DATABASE_URL
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: eks/acme-main-v2-prd
        property: outline_oidc_client_secret
    - secretKey: DB_PASSWORD
      remoteRef:
        key: outline/prd
        property: DB_PASSWORD
    - secretKey: NOTION_CLIENT_ID
      remoteRef:
        key: eks/acme-main-v2-prd
        property: outline_notion_client_id
    - secretKey: NOTION_CLIENT_SECRET
      remoteRef:
        key: eks/acme-main-v2-prd
        property: outline_notion_client_secret
