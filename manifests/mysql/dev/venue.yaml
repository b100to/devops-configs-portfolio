# Venue MySQL Proxy
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: venue-mysql-proxy
  namespace: default
  labels:
    app: venue-mysql-proxy
    service: venue
    component: mysql-proxy
spec:
  serviceName: venue-mysql-service
  replicas: 1
  selector:
    matchLabels:
      app: venue-mysql-proxy
  template:
    metadata:
      labels:
        app: venue-mysql-proxy
        service: venue
        component: mysql-proxy
    spec:
      containers:
        - name: mysql-proxy
          image: alpine/socat
          command:
            - socat
            - TCP-LISTEN:3306,fork,reuseaddr
            - TCP:service-rds.dev.acme.example:3306
          ports:
            - containerPort: 3306
              name: mysql
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE
      tolerations:
        - key: "node-group-type"
          operator: "Equal"
          value: "base"
          effect: "NoSchedule"

---
# Venue MySQL Service
apiVersion: v1
kind: Service
metadata:
  name: venue-mysql-service
  namespace: default
  labels:
    app: venue-mysql-proxy
    service: venue
spec:
  selector:
    app: venue-mysql-proxy
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
      protocol: TCP
  type: ClusterIP
