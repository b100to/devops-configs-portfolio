# Mall Clone MySQL Proxy
# 매일 생성되는 mall 클론 DB(acmemall-prod-db-clone-YYYY-MM-DD)용 프록시.
# 타겟은 클론 생성 스크립트가 매일 갱신하는 stable 별칭이라 날짜 회전을 자동 흡수한다.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mall-clone-mysql-proxy
  namespace: default
  labels:
    app: mall-clone-mysql-proxy
    service: mall-clone
    component: mysql-proxy
spec:
  serviceName: mall-clone-mysql-service
  replicas: 1
  selector:
    matchLabels:
      app: mall-clone-mysql-proxy
  template:
    metadata:
      labels:
        app: mall-clone-mysql-proxy
        service: mall-clone
        component: mysql-proxy
    spec:
      containers:
        - name: mysql-proxy
          image: alpine/socat
          command:
            - socat
            - TCP-LISTEN:3306,fork,reuseaddr
            - TCP:acmemall-clone-db.acme.example:3306
          ports:
            - containerPort: 3306
              name: mysql
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE
      tolerations:
        - key: "node-group-type"
          operator: "Equal"
          value: "base"
          effect: "NoSchedule"

---
# Mall Clone MySQL Service
apiVersion: v1
kind: Service
metadata:
  name: mall-clone-mysql-service
  namespace: default
  labels:
    app: mall-clone-mysql-proxy
    service: mall-clone
spec:
  selector:
    app: mall-clone-mysql-proxy
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
      protocol: TCP
  type: ClusterIP
