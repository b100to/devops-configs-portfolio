apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  labels:
    app: backend
data:
  DB_HOST: "airflow.cluster-abcdefghijkl.ap-northeast-2.rds.amazonaws.com"
  DB_PORT: "5432"
  DB_NAME: "stockroom"
  DB_SSLMODE: "require"
  PORT: "8080"
  GOOGLE_CLIENT_ID: "000000000000-example.apps.googleusercontent.com"

