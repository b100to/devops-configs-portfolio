apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backend-secret
  namespace: stockroom
  labels:
    app: stockroom-backend
spec:
  refreshInterval: "15m"
  secretStoreRef:
    name: aws-secrets-store
    kind: ClusterSecretStore
  target:
    name: backend-secret
    creationPolicy: Owner
  data:
    - secretKey: DB_USER
      remoteRef:
        key: eks/acme-main-v2-prd
        property: stockroom_DB_USER
    - secretKey: DB_PASSWORD
      remoteRef:
        key: eks/acme-main-v2-prd
        property: stockroom_DB_PASSWORD
