apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: stockroom-frontend
    app.kubernetes.io/name: stockroom-frontend
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: stockroom-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: stockroom-frontend
  template:
    metadata:
      labels:
        app: stockroom-frontend
        app.kubernetes.io/name: stockroom-frontend
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: stockroom-system
    spec:
      containers:
        - name: frontend
          image: 222222222222.dkr.ecr.ap-northeast-2.amazonaws.com/stockroom/frontend:latest
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: frontend-config
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "25m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  labels:
    app: stockroom-frontend
    app.kubernetes.io/name: stockroom-frontend
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: stockroom-system
spec:
  selector:
    app.kubernetes.io/name: stockroom-frontend
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
  type: ClusterIP
