apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: batch
  labels:
    node-group-type: batch
spec:
  weight: 10
  template:
    metadata:
      labels:
        node-group-type: batch
    spec:
      expireAfter: 2160h
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: batch
      requirements:
        - key: node.kubernetes.io/instance-type
          operator: In
          values:
            - "c8g.2xlarge" # 8 vCPU, 16 GiB
        - key: kubernetes.io/arch
          operator: In
          values:
            - arm64
        - key: kubernetes.io/os
          operator: In
          values:
            - linux
        - key: karpenter.sh/capacity-type
          operator: In
          values:
            - spot
      taints:
        - effect: NoSchedule
          key: node-group-type
          value: batch
  limits:
    cpu: 8
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1h
---
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: batch
spec:
  amiFamily: "AL2023"
  metadataOptions:
    httpEndpoint: enabled
    httpTokens: optional
    httpPutResponseHopLimit: 2
  role: arn:aws:iam::222222222222:role/Karpenter-acme-main-v2-prd-20260122051612599200000003
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: acme-main-v2-prd
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: "true"
  amiSelectorTerms:
    - alias: al2023@v20260129
  tags:
    karpenter.sh/discovery: "true"
    Name: acme-main-prd-batch
    Environment: prd
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 50Gi
        volumeType: gp3
        encrypted: true
        kmsKeyID: "alias/aws/ebs"
