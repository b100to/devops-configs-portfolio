  # Google SSO 최초 로그인 시 external로 생성되는 유저를 internal로 자동 변경
  # 배경: external 유저는 authentik 대시보드/앱 접근이 제한되어 수동 변경이 필요했음
  # 방법: 기존 default-source-enrollment-write 스테이지의 user_type을 internal로 직접 수정
  # v2: non-dev 그룹을 이 블루프린트 내에서 먼저 생성 후 !KeyOf로 참조
  #     (이전 v1은 !Find로 non-dev 그룹 참조했으나, 알파벳 순서상 non-dev-access-control.yaml보다
  #      먼저 실행되어 그룹이 없어 !Find가 실패함)
  enrollment-internal-user.yaml: |
    version: 1
    metadata:
      name: Enrollment - Auto Internal User Type v2
      labels:
        blueprints.goauthentik.io/instantiate: "true"
    entries:
      # non-dev 그룹을 먼저 생성 (enrollment write stage에서 !KeyOf로 참조)
      # 이 blueprint가 non-dev-access-control.yaml보다 알파벳 순서상 먼저 실행되므로
      # 여기서 그룹을 생성해야 !Find 실패를 피할 수 있음
      - model: authentik_core.group
        id: non-dev-group
        state: present
        identifiers:
          name: non-dev
        attrs:
          name: non-dev

      # 이전에 추가했던 order=100 스테이지 제거 (효과 없었음)
      - model: authentik_stages_user_write.userwritestage
        state: absent
        identifiers:
          name: acme-enrollment-write-internal

      # 기존 enrollment write 스테이지를 직접 internal로 변경 (order=1에서 실제로 유저 생성)
      # create_users_group: Google SSO 최초 로그인 시 자동으로 non-dev 그룹 배정 (wiki만 접근)
      # 개발자는 수동으로 main 그룹에 추가
      # !KeyOf를 사용하여 이 blueprint에서 생성한 non-dev 그룹을 참조 (!Find 의존성 제거)
      - model: authentik_stages_user_write.userwritestage
        state: present
        identifiers:
          name: default-source-enrollment-write
        attrs:
          user_type: internal
          create_users_as_inactive: false
          create_users_group: !KeyOf non-dev-group

      # 서비스 계정 Google SSO 가입 차단
      # 새 이메일 차단 시 BLOCKED_EMAILS 리스트에 추가
      - model: authentik_policies_expression.expressionpolicy
        id: block-service-accounts-policy
        state: present
        identifiers:
          name: Block Service Accounts
        attrs:
          expression: |
            BLOCKED_EMAILS = [
                "datadog-read@acme-corp.example",
            ]
            email = request.context.get("prompt_data", {}).get("email", "")
            if not email:
                email = getattr(request.user, "email", "")
            return email.lower() not in [e.lower() for e in BLOCKED_EMAILS]

      # policybinding 자체는 blueprint 선언에서 제거 (이미 DB에 동일하게 존재 - 기능 영향 없음)
      # 원인: authentik !Find 태그가 PolicyBindingModel(Flow)의 target을 pk로 resolve하지만
      #       실제 PolicyBinding.target 컬럼은 pbm_uuid를 참조 → identifiers 매칭 실패
      #       → 매번 신규 생성 시도 → (policy, target, order) unique 제약 위반으로 blueprint
      #       전체가 status=error 처리되어, 같은 blueprint의 create_users_group 변경(non-dev)도
      #       한 번도 실제 반영되지 못하고 있었음 (실측: 라이브 값이 여전히 main 그룹)

  # 비개발자 롤 + 앱별 접근 제한
  # non-dev 그룹: wiki(Outline)만 접근 가능 (Authentik 포털에서 wiki만 보임)
  # main 그룹: 개발자 전용 앱 모두 접근 가능
  # 신규 사용자 → non-dev 자동 배정, 개발자는 수동으로 main 그룹 추가
  non-dev-access-control.yaml: |
    version: 1
    metadata:
      name: Non-Dev Access Control
      labels:
        blueprints.goauthentik.io/instantiate: "true"
    entries:
      # non-dev 그룹 생성
      - model: authentik_core.group
        id: non-dev-group
        state: present
        identifiers:
          name: non-dev
        attrs:
          name: non-dev

      # 개발자 전용 앱 접근 정책 (main 그룹만)
      - model: authentik_policies_expression.expressionpolicy
        id: dev-only-access-policy
        state: present
        identifiers:
          name: Dev Only Access Policy
        attrs:
          expression: |
            return ak_is_group_member(request.user, name="main") or ak_is_group_member(request.user, name="authentik Admins")

      # ArgoCD (prd) - main 그룹만
      - model: authentik_policies.policybinding
        state: present
        identifiers:
          order: 10
          target: !Find [authentik_core.application, [slug, argocd]]
          policy: !KeyOf dev-only-access-policy

      # ArgoCD (dev) - main 그룹만
      - model: authentik_policies.policybinding
        state: present
        identifiers:
          order: 10
          target: !Find [authentik_core.application, [slug, argocd-dev]]
          policy: !KeyOf dev-only-access-policy

      # Grafana (prd) - main 그룹만
      - model: authentik_policies.policybinding
        state: present
        identifiers:
          order: 10
          target: !Find [authentik_core.application, [slug, grafana]]
          policy: !KeyOf dev-only-access-policy

      # Grafana (dev) - main 그룹만
      - model: authentik_policies.policybinding
        state: present
        identifiers:
          order: 10
          target: !Find [authentik_core.application, [slug, grafana-dev]]
          policy: !KeyOf dev-only-access-policy

      # Airflow Green - main 그룹만
      - model: authentik_policies.policybinding
        state: present
        identifiers:
          order: 10
          target: !Find [authentik_core.application, [slug, airflow-green]]
          policy: !KeyOf dev-only-access-policy

      # Argo Workflows (prd) - main 그룹만
      - model: authentik_policies.policybinding
        state: present
        identifiers:
          order: 10
          target: !Find [authentik_core.application, [slug, argo-workflows]]
          policy: !KeyOf dev-only-access-policy

      # Argo Workflows (dev) - main 그룹만
      - model: authentik_policies.policybinding
        state: present
        identifiers:
          order: 10
          target: !Find [authentik_core.application, [slug, argo-workflows-dev]]
          policy: !KeyOf dev-only-access-policy

      # Datadog - main 그룹만
      - model: authentik_policies.policybinding
        state: present
        identifiers:
          order: 10
          target: !Find [authentik_core.application, [slug, datadog]]
          policy: !KeyOf dev-only-access-policy

      # NOTE: kubecost / kubecost-prd 바인딩 제거됨.
      # dev kubecost 는 2026-06-08 철거(#260, #262)되며 authentik Application 도 사라졌고,
      # kubecost-prd Application 은 애초에 생성된 적이 없다. 존재하지 않는 앱을 !Find 하면
      # 이 블루프린트 전체가 apply 실패한다. prd kubecost 의 SSO 는 Application 이 아니라
      # oauth2provider(client_id: kubecost)로 동작하므로 영향 없음.
      # 복구가 필요하면 argocd/dev/infra/ops/kubecost.RESTORE.md 참조.

      # ArgoCD CLI - main 그룹만 (앱 정의는 argocd-application.yaml, 포털에서는 숨김)
      - model: authentik_policies.policybinding
        state: present
        identifiers:
          order: 10
          target: !Find [authentik_core.application, [slug, argocd-cli]]
          policy: !KeyOf dev-only-access-policy

      # Kafka UI (dev) - main 그룹만
      - model: authentik_policies.policybinding
        state: present
        identifiers:
          order: 10
          target: !Find [authentik_core.application, [slug, kafka-ui-dev]]
          policy: !KeyOf dev-only-access-policy
