# Venue Redis Proxy
apiVersion: apps/v1
kind: Deployment
metadata:
  name: venue-redis-proxy
  namespace: default
  labels:
    app: venue-redis-proxy
    service: venue
    component: redis-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: venue-redis-proxy
  template:
    metadata:
      labels:
        app: venue-redis-proxy
        service: venue
        component: redis-proxy
    spec:
      containers:
        - name: redis-proxy
          image: alpine/socat
          command:
            - socat
            - TCP-LISTEN:6379,fork,reuseaddr
            - TCP:acme-prd-redis.apn2.cache.amazonaws.com:6379
          ports:
            - containerPort: 6379
              name: redis
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE

---
# Venue Redis Service
apiVersion: v1
kind: Service
metadata:
  name: venue-redis-service
  namespace: default
  labels:
    app: venue-redis-proxy
    service: venue
spec:
  selector:
    app: venue-redis-proxy
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
      protocol: TCP
  type: ClusterIP
