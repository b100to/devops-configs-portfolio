apiVersion: v1
kind: PersistentVolume
metadata:
  name: kafka-controller-pv
spec:
  capacity:
    storage: 50Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: gp3
  csi:
    driver: ebs.csi.aws.com
    fsType: ext4
    volumeHandle: vol-00000000000000002
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: topology.kubernetes.io/zone
              operator: In
              values:
                - ap-northeast-2c
  claimRef:
    name: data-kafka-controller-0
    namespace: kafka
