{{- if .Values.externalSecret.enabled }}
{{- range .Values.externalSecret.secrets }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .name }}
  {{- if $.Values.namespace.name }}
  namespace: {{ $.Values.namespace.name }}
  {{- end }}
  {{- if .labels }}
  labels:
    {{- toYaml .labels | nindent 4 }}
  {{- end }}
  {{- if .annotations }}
  annotations:
    {{- toYaml .annotations | nindent 4 }}
  {{- end }}
spec:
  refreshInterval: {{ .refreshInterval | default "15m" | quote }}
  secretStoreRef:
    name: {{ .secretStoreRef.name | default "aws-secrets-store" }}
    kind: {{ .secretStoreRef.kind | default "ClusterSecretStore" }}
  target:
    name: {{ .target.name }}
    {{- if .target.creationPolicy }}
    creationPolicy: {{ .target.creationPolicy }}
    {{- else }}
    creationPolicy: Owner
    {{- end }}
    {{- if .target.template }}
    template:
      {{- toYaml .target.template | nindent 6 }}
    {{- end }}
  {{- if .dataFrom }}
  dataFrom:
    {{- toYaml .dataFrom | nindent 4 }}
  {{- end }}
  {{- if .data }}
  data:
    {{- range .data }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        key: {{ .remoteRef.key }}
        {{- if .remoteRef.property }}
        property: {{ .remoteRef.property }}
        {{- end }}
        {{- if .remoteRef.version }}
        version: {{ .remoteRef.version }}
        {{- end }}
    {{- end }}
  {{- end }}
{{- end }}
{{- end }}
