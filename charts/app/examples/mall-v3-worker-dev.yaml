# =============================================================================
# Mall v3 Worker - Development Environment
# =============================================================================

global:
  env: dev
  registry:
    accountId: "111111111111"
    region: "ap-northeast-2"

# =============================================================================
# Application
# =============================================================================
fullnameOverride: mall-v3-worker

# Namespace (없으면 자동 생성)
namespace:
  name: mall-v3

# =============================================================================
# Image
# =============================================================================
image:
  repository: acmemall-backend-v3/dev/worker
  tag: latest
  pullPolicy: IfNotPresent

# =============================================================================
# Service Account
# =============================================================================
serviceAccount:
  create: true
  name: default

# =============================================================================
# Deployment
# =============================================================================
replicaCount: 1

# =============================================================================
# Service
# =============================================================================
service:
  enabled: true
  type: ClusterIP
  port: 8000

# =============================================================================
# Health Checks
# =============================================================================
livenessProbe:
  enabled: true
  httpGet:
    path: /ht/
    port: 8000
  initialDelaySeconds: 30
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 3
  successThreshold: 1

readinessProbe:
  enabled: true
  httpGet:
    path: /ht/
    port: 8000
  initialDelaySeconds: 30
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 3
  successThreshold: 1

# =============================================================================
# Resources
# =============================================================================
resources:
  requests:
    cpu: 100m
    memory: 1Gi
  limits:
    memory: 1Gi

# =============================================================================
# Autoscaling
# =============================================================================
autoscaling:
  enabled: false

# =============================================================================
# Environment Variables
# =============================================================================
env:
  - name: WORKER_TYPE
    value: celery
  # 추가 환경 변수는 여기에...

# =============================================================================
# AWS
# =============================================================================
aws:
  enabled: false

# =============================================================================
# Datadog
# =============================================================================
datadog:
  enabled: true
  version: v3
  logsInjection: "true"
  traceSampleRate: "0.1"

# =============================================================================
# Scheduling
# =============================================================================
labels:
  node-group-type: mall-v3

# nodeSelector:
#   karpenter.sh/nodepool: mall-v3

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app: mall-v3-worker
