# =============================================================================
# Complete External Secrets Example
# SecretStore + ExternalSecret + Application 통합 예시
# =============================================================================

global:
  env: dev
  registry:
    accountId: "111111111111"
    region: "ap-northeast-2"

fullnameOverride: venue-user-api

namespace:
  name: venue
  labels:
    env: dev
    team: venue

# =============================================================================
# External Secrets (AWS Secrets Manager에서 가져오기)
# (ClusterSecretStore 'aws-secrets-store'가 이미 존재한다고 가정)
# =============================================================================
externalSecret:
  enabled: true
  secrets:
    # AWS Credentials
    - name: aws-credentials
      refreshInterval: "15m"
      secretStoreRef:
        name: aws-secrets-store
        kind: ClusterSecretStore
      target:
        name: aws-account
        creationPolicy: Owner
      data:
        - secretKey: AWS_ACCESS_KEY_ID
          remoteRef:
            key: eks/acme-main-dev
            property: AWS_ACCESS_KEY_ID
        - secretKey: AWS_SECRET_ACCESS_KEY
          remoteRef:
            key: eks/acme-main-dev
            property: AWS_SECRET_ACCESS_KEY

    # Database Credentials
    - name: db-credentials
      refreshInterval: "15m"
      secretStoreRef:
        name: aws-secrets-store
        kind: ClusterSecretStore
      target:
        name: database-secret
        creationPolicy: Owner
      data:
        - secretKey: DB_HOST
          remoteRef:
            key: eks/venue-db-dev
            property: host
        - secretKey: DB_PORT
          remoteRef:
            key: eks/venue-db-dev
            property: port
        - secretKey: DB_USERNAME
          remoteRef:
            key: eks/venue-db-dev
            property: username
        - secretKey: DB_PASSWORD
          remoteRef:
            key: eks/venue-db-dev
            property: password
        - secretKey: DB_NAME
          remoteRef:
            key: eks/venue-db-dev
            property: database

    # Application Secrets
    - name: app-secrets
      refreshInterval: "15m"
      secretStoreRef:
        name: aws-secrets-store
        kind: ClusterSecretStore
      target:
        name: app-secrets
        creationPolicy: Owner
      data:
        - secretKey: JWT_SECRET
          remoteRef:
            key: eks/venue-app-dev
            property: jwt_secret
        - secretKey: API_KEY
          remoteRef:
            key: eks/venue-app-dev
            property: api_key

# =============================================================================
# Image
# =============================================================================
image:
  repository: venue-user-api-dev
  tag: latest
  pullPolicy: IfNotPresent

# =============================================================================
# Service Account
# =============================================================================
serviceAccount:
  create: true
  name: app-venue
  # annotations:
  #   eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/venue-role

# =============================================================================
# Deployment
# =============================================================================
replicaCount: 2

priorityClassName: high-priority

# =============================================================================
# Service
# =============================================================================
service:
  enabled: true
  type: ClusterIP
  port: 8080
  targetPort: 8080

# =============================================================================
# Health Checks
# =============================================================================
livenessProbe:
  enabled: true
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 3
  successThreshold: 1

readinessProbe:
  enabled: true
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 3
  successThreshold: 1

# =============================================================================
# Resources
# =============================================================================
resources:
  requests:
    cpu: 50m
    memory: 512Mi
  limits:
    memory: 512Mi

# =============================================================================
# Autoscaling
# =============================================================================
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

# =============================================================================
# Environment Variables (External Secrets에서 생성된 Secret 사용)
# =============================================================================
env:
  - name: SPRING_PROFILES_ACTIVE
    value: dev
  - name: SERVER_PORT
    value: "8080"

# envFrom으로 모든 시크릿 주입
envFrom:
  - secretRef:
      name: aws-account
  - secretRef:
      name: database-secret
  - secretRef:
      name: app-secrets

# =============================================================================
# AWS (External Secret에서 생성된 aws-account 사용)
# =============================================================================
aws:
  enabled: false # envFrom으로 직접 주입되므로 비활성화

# =============================================================================
# Datadog
# =============================================================================
datadog:
  enabled: true
  version: latest
  logsInjection: "true"
  traceSampleRate: "0.1"

podAnnotations:
  admission.datadoghq.com/java-lib.version: "v1.37.1"

# =============================================================================
# Scheduling
# =============================================================================
nodeSelector:
  karpenter.sh/nodepool: service

tolerations:
  - key: node-group-type
    operator: Equal
    value: service
    effect: NoSchedule

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app: venue-user-api
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app: venue-user-api

# =============================================================================
# Labels
# =============================================================================
labels:
  team: venue
  service: user-api
  env: dev
