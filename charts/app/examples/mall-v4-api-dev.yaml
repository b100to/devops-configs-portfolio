# =============================================================================
# Mall v4 API - Development Environment
# =============================================================================

global:
  env: dev
  registry:
    accountId: "111111111111"
    region: "ap-northeast-2"

# =============================================================================
# Application
# =============================================================================
fullnameOverride: mall-v4-api

# Namespace (없으면 자동 생성)
namespace:
  name: mall-v4

# =============================================================================
# Image
# =============================================================================
image:
  repository: acmemall-backend-v4/dev/api
  tag: latest
  pullPolicy: IfNotPresent

# =============================================================================
# Service Account
# =============================================================================
serviceAccount:
  create: true
  name: app-mall
  # annotations:
  #   eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/mall-v4-role

# =============================================================================
# Deployment
# =============================================================================
replicaCount: 1

podAnnotations:
  admission.datadoghq.com/java-lib.version: "v1.37.1"

# =============================================================================
# Service
# =============================================================================
service:
  enabled: true
  type: ClusterIP
  port: 8080
  targetPort: 8080

# =============================================================================
# Health Checks
# =============================================================================
livenessProbe:
  enabled: true
  httpGet:
    path: /actuator/health/liveness
    port: http
  initialDelaySeconds: 5
  periodSeconds: 15
  timeoutSeconds: 1
  failureThreshold: 3
  successThreshold: 1

readinessProbe:
  enabled: true
  httpGet:
    path: /actuator/health/readiness
    port: http
  initialDelaySeconds: 5
  periodSeconds: 15
  timeoutSeconds: 1
  failureThreshold: 3
  successThreshold: 1

startupProbe:
  enabled: true
  httpGet:
    path: /actuator/health/liveness
    port: http
  periodSeconds: 10
  failureThreshold: 30

# =============================================================================
# Resources
# =============================================================================
resources:
  requests:
    cpu: 50m
    memory: 900Mi
  limits:
    memory: 900Mi

# =============================================================================
# Autoscaling
# =============================================================================
autoscaling:
  enabled: false

# =============================================================================
# Environment Variables
# =============================================================================
env: []

# =============================================================================
# AWS
# =============================================================================
aws:
  enabled: true
  region: ap-northeast-2
  credentials:
    fromSecret: true
    secretName: aws-account

# =============================================================================
# Datadog
# =============================================================================
datadog:
  enabled: true
  version: v4
  logsInjection: "true"
  traceSampleRate: "0.1"

# =============================================================================
# Scheduling
# =============================================================================
# nodeSelector:
#   karpenter.sh/nodepool: mall-v4

# tolerations:
#   - key: node-group-type
#     operator: Equal
#     value: mall-v4
#     effect: NoSchedule

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app: mall-v4-api
