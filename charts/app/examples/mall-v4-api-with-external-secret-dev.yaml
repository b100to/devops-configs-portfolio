# =============================================================================
# External Secret Example - AWS Credentials for Mall
# =============================================================================

global:
  env: dev
  registry:
    accountId: "111111111111"
    region: "ap-northeast-2"

fullnameOverride: mall-v4-api

namespace:
  name: mall-v4

# =============================================================================
# Image
# =============================================================================
image:
  repository: acmemall-backend-v4/dev/api
  tag: latest

# =============================================================================
# Service Account
# =============================================================================
serviceAccount:
  create: true
  name: app-mall

# =============================================================================
# Service
# =============================================================================
service:
  enabled: true
  port: 8080

# =============================================================================
# Resources
# =============================================================================
resources:
  requests:
    cpu: 50m
    memory: 900Mi
  limits:
    memory: 900Mi

# =============================================================================
# External Secrets
# (ClusterSecretStore 'aws-secrets-store'가 이미 존재한다고 가정)
# =============================================================================
externalSecret:
  enabled: true
  secrets:
    # AWS Credentials Secret
    - name: aws-credentials
      refreshInterval: "15m"
      secretStoreRef:
        name: aws-secrets-store
        kind: ClusterSecretStore
      target:
        name: aws-account
        creationPolicy: Owner
      data:
        - secretKey: AWS_ACCESS_KEY_ID
          remoteRef:
            key: eks/acme-main-dev
            property: AWS_ACCESS_KEY_ID
        - secretKey: AWS_SECRET_ACCESS_KEY
          remoteRef:
            key: eks/acme-main-dev
            property: AWS_SECRET_ACCESS_KEY

# =============================================================================
# AWS (External Secret에서 생성된 aws-account 사용)
# =============================================================================
aws:
  enabled: true
  region: ap-northeast-2
  credentials:
    fromSecret: true
    secretName: aws-account

# =============================================================================
# Datadog
# =============================================================================
datadog:
  enabled: true
  version: v4

# =============================================================================
# Health Checks
# =============================================================================
livenessProbe:
  enabled: true
  httpGet:
    path: /actuator/health/liveness
    port: http

readinessProbe:
  enabled: true
  httpGet:
    path: /actuator/health/readiness
    port: http

startupProbe:
  enabled: true
  httpGet:
    path: /actuator/health/liveness
    port: http
