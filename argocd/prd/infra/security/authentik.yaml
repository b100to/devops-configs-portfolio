apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: authentik
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://github.com/AcmeCorp/devops-configs.git
      targetRevision: main
      path: .
      ref: values
    - repoURL: https://github.com/AcmeCorp/devops-configs.git
      targetRevision: main
      path: manifests/authentik/prd
    - repoURL: https://charts.goauthentik.io
      chart: authentik
      targetRevision: 2025.10.3
      helm:
        releaseName: authentik
        valueFiles:
          - $values/values/infra/authentik/prd.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: authentik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
