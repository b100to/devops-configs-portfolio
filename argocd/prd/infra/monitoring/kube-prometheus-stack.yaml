apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    # CRD가 매우 큼(특히 Prometheus CR) → ArgoCD가 client-side apply로 깨질 수 있음.
    # ServerSideApply=true 로 EKS API server가 직접 처리하게 위임.
    argocd.argoproj.io/sync-options: ServerSideApply=true
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://github.com/AcmeCorp/devops-configs.git
      targetRevision: main
      path: .
      ref: values
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 84.3.0
      helm:
        releaseName: kube-prometheus-stack
        valueFiles:
          - $values/values/infra/monitoring/kube-prometheus-stack/prd.yaml
        skipCrds: false
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
