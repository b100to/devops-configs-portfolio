apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: db-proxy
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://github.com/AcmeCorp/devops-configs.git
      targetRevision: main
      path: ./manifests/redis/dev
    - repoURL: https://github.com/AcmeCorp/devops-configs.git
      targetRevision: main
      path: ./manifests/mysql/dev
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
