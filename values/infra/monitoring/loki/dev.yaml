loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  storage_config:
    aws:
      region: ap-northeast-2
      bucketnames: "acme-main-dev-loki-chunk"
      s3forcepathstyle: false
  pattern_ingester:
    enabled: true
  limits_config:
    allow_structured_metadata: true
    volume_enabled: true
    retention_period: 720h # 30 days retention

  storage:
    type: s3
    bucketNames:
      chunks: "acme-main-dev-loki-chunk"
      ruler: "acme-main-dev-loki-ruler"
      admin: "acme-main-dev-loki-admin"
    s3:
      region: ap-northeast-2
      signatureVersion: v4
      s3ForcePathStyle: false
      insecure: false

# Disable minio storage
minio:
  enabled: false

# Chunks cache configuration (메모리 최적화)
chunksCache:
  enabled: true
  allocatedMemory: 512 # 8192MB → 512MB (dev 환경)
  maxItemMemory: 1 # 5MB → 1MB
  connectionLimit: 1024 # 16384 → 1024
  writebackSizeLimit: 50MB # 500MB → 50MB
  writebackBuffer: 50000 # 500000 → 50000
  l2:
    enabled: false # dev에서는 L2 캐시 불필요
  resources:
    requests:
      cpu: 10m # Kubecost 7d avg 1m / 0.7 (min 10m)
      memory: 32Mi # Kubecost 7d avg 6Mi / 0.7 (min 32Mi)
    limits:
      cpu: 200m
      memory: 512Mi

# Results cache configuration
resultsCache:
  enabled: true
  resources:
    requests:
      cpu: 10m # Kubecost 7d avg 1m / 0.7 (min 10m)
      memory: 32Mi # Kubecost 7d avg 3Mi / 0.7 (min 32Mi)
    limits:
      cpu: 200m
      memory: 512Mi

deploymentMode: SingleBinary

singleBinary:
  replicas: 1
  persistence:
    storageClass: gp3
    accessModes:
      - ReadWriteOnce
    size: 30Gi

# Zero out replica counts of other deployment modes
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0

ingester:
  replicas: 0
querier:
  replicas: 0
queryFrontend:
  replicas: 0
queryScheduler:
  replicas: 0
distributor:
  replicas: 0
compactor:
  replicas: 0
indexGateway:
  replicas: 0
bloomCompactor:
  replicas: 0
bloomGateway:
  replicas: 0
