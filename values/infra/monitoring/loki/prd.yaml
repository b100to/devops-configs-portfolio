loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  storage_config:
    aws:
      region: ap-northeast-2
      bucketnames: "acme-main-v2-prd-loki-chunk"
      s3forcepathstyle: false
  limits_config:
    retention_period: 168h # 7일로 단축 (비용 절감)
    max_global_streams_per_user: 50000
    ingestion_rate_mb: 64
    ingestion_burst_size_mb: 128
    query_timeout: 2m
    max_query_parallelism: 32
    max_entries_limit_per_query: 10000

  # 최소한의 S3 설정
  storage:
    type: s3
    bucketNames:
      chunks: "acme-main-v2-prd-loki-chunk"
      ruler: "acme-main-v2-prd-loki-ruler"
      admin: "acme-main-v2-prd-loki-admin"
    s3:
      region: ap-northeast-2
      signatureVersion: v4
      s3ForcePathStyle: false
      insecure: false

chunksCache:
  enabled: false # 필요시 true로 변경
  # 메모리 최적화 설정 (prd 환경)
  allocatedMemory: 2048 # 8192MB → 2048MB (2GB)
  maxItemMemory: 2 # 5MB → 2MB
  connectionLimit: 4096 # 16384 → 4096
  writebackSizeLimit: 200MB # 500MB → 200MB
  writebackBuffer: 200000 # 500000 → 200000
  l2:
    enabled: false # 필요시 활성화
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: karpenter.sh/nodepool
                operator: In
                values:
                  - base
                  - mall-v4-batch
                  - mall-v3
                  - mall-v4
                  - service
                  - airflow
  tolerations:
    - key: node-group-type
      value: base
      effect: NoSchedule
      operator: Equal
    - key: node-group-type
      value: service
      effect: NoSchedule
      operator: Equal
    - key: node-group-type
      value: mall-v3
      effect: NoSchedule
      operator: Equal
    - key: node-group-type
      value: mall-v4
      effect: NoSchedule
      operator: Equal
    - key: node-group-type
      value: mall-v4-batch
      effect: NoSchedule
      operator: Equal
    - key: node-group-type
      value: airflow
      effect: NoSchedule
      operator: Equal

# 심플 단일 바이너리 모드
deploymentMode: SingleBinary
singleBinary:
  replicas: 1
  persistence:
    storageClass: gp3
    size: 50Gi
  # 넉넉한 리소스 설정
  resources:
    requests:
      cpu: 25m    # Kubecost 7d avg 15m / 0.6
      memory: 977Mi  # Kubecost 7d avg 586.4Mi / 0.6
    limits:
      cpu: 200m
      memory: 2Gi
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: karpenter.sh/nodepool
                operator: In
                values:
                  - base
  tolerations:
    - key: node-group-type
      value: base
      effect: NoSchedule
      operator: Equal

# 분산 모드 모두 비활성화
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0
ingester:
  replicas: 0
querier:
  replicas: 0
queryFrontend:
  replicas: 0
queryScheduler:
  replicas: 0
distributor:
  replicas: 0
compactor:
  replicas: 0
indexGateway:
  replicas: 0
bloomCompactor:
  replicas: 0
bloomGateway:
  replicas: 0

# 기타 기능 비활성화
minio:
  enabled: false

# 모니터링 비활성화
serviceMonitor:
  enabled: false

# 테스트 설정
test:
  enabled: false
