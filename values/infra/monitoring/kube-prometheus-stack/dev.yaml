# =============================================================================
# kube-prometheus-stack — dev
# -----------------------------------------------------------------------------
# Datadog Infra/Logs/Profiler를 OSS로 단계 전환하는 첫 단계.
# 이 파일에서는 dev 메트릭 수집(Prometheus + Operator + Alertmanager)만 도입.
# Grafana는 별도 차트로 이미 운영 중이므로 비활성화.
# =============================================================================

# Grafana 자체는 별도 차트로 운영 중 → 중복 배포 금지
grafana:
  enabled: false

# Windows 노드 없음 → 비활성화
windowsMonitoring:
  enabled: false
prometheus-windows-exporter:
  enabled: false

# -----------------------------------------------------------------------------
# CRD/Operator
# -----------------------------------------------------------------------------
crds:
  # ArgoCD가 CRD를 직접 관리하도록 함 (ServerSideApply=true 와 함께)
  enabled: true

prometheusOperator:
  resources:
    requests:
      cpu: 20m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  # 다른 namespace의 ServiceMonitor도 자동으로 수집하도록 selector 비움
  admissionWebhooks:
    patch:
      resources:
        requests:
          cpu: 10m
          memory: 64Mi

# -----------------------------------------------------------------------------
# Prometheus
# -----------------------------------------------------------------------------
prometheus:
  prometheusSpec:
    # 모든 namespace의 ServiceMonitor/PodMonitor/PrometheusRule 자동 수집
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    scrapeConfigSelectorNilUsesHelmValues: false

    # dev 보존 기간: 짧게 시작 (필요 시 늘림)
    retention: 7d
    retentionSize: "20GB"

    # Prometheus 자체 리소스
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 2Gi

    # PVC (gp3, dev는 30Gi로 시작)
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 30Gi

    # 추가 외부 레이블 (다중 클러스터 식별용)
    externalLabels:
      cluster: acme-main-v2-dev
      env: dev

# -----------------------------------------------------------------------------
# Alertmanager
# -----------------------------------------------------------------------------
alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi

    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi

  # 라우팅/리시버는 AlertmanagerConfig CRD로 별도 관리 (TODO: 후속 PR)
  # 일단 기본 라우트만 두고 실제 알림은 disabled 상태로 시작
  config:
    global:
      resolve_timeout: 5m
    route:
      group_by: ["namespace", "alertname"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: "null"
    receivers:
      - name: "null"
    inhibit_rules:
      - source_matchers:
          - "severity = critical"
        target_matchers:
          - "severity =~ warning|info"
        equal: ["namespace", "alertname"]

# -----------------------------------------------------------------------------
# 노드/Pod 메트릭 수집기
# -----------------------------------------------------------------------------
nodeExporter:
  enabled: true

prometheus-node-exporter:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi
  # Kubecost가 자체 prometheus-node-exporter를 hostPort 9100 으로 깔아둠.
  # 두 DaemonSet이 동일 포트를 점유하려고 해서 우리 쪽이 Pending.
  # 우리 node-exporter를 9101로 옮겨 충돌 회피.
  # TODO: Kubecost가 kube-prom-stack node-exporter 메트릭을 공유하도록 정리 (별도 작업).
  # service.port 변경만으로 차트가 --web.listen-address=:9101 자동 렌더
  # extraArgs에 path.procfs/sysfs/web.listen-address 넣으면 차트 기본값과 중복되어 CrashLoop
  service:
    port: 9101
    targetPort: 9101

kubeStateMetrics:
  enabled: true

kube-state-metrics:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 256Mi

# -----------------------------------------------------------------------------
# 컨트롤 플레인 컴포넌트 (EKS는 마스터 노드 접근 불가 → 모두 비활성화)
# -----------------------------------------------------------------------------
kubeApiServer:
  enabled: true # API server는 in-cluster service 통해 접근 가능
kubeControllerManager:
  enabled: false # EKS 마스터 노드 접근 불가
kubeScheduler:
  enabled: false # EKS 마스터 노드 접근 불가
kubeProxy:
  enabled: true
kubeEtcd:
  enabled: false # EKS 관리 영역
coreDns:
  enabled: true
kubelet:
  enabled: true
