# =============================================================================
# Fluent Bit — prd
# -----------------------------------------------------------------------------
# Alloy를 대체하는 경량 로그 수집기 (로그 전용이라 Fluent Bit가 적합).
# dev 대비 추가: 노드 시스템 로그(kubelet + containerd) 수집.
#   - Alloy(loki.source.kubernetes)는 Pod stdout/stderr만 수집 가능 → 노드 로그 사각지대
#   - Fluent Bit systemd INPUT으로 journald(kubelet/containerd) 수집 → 노드 NotReady,
#     이미지 pull 실패, 컨테이너 런타임 오류 등 노드 레벨 트러블슈팅 가능
# Pipelines:
#   kube.* : Pod logs → K8s enrichment → namespace/noise 필터 → Loki
#   host.* : journald(kubelet, containerd) → Loki
# =============================================================================

logLevel: error

config:
  service: |
    [SERVICE]
        Daemon       Off
        Flush        1
        Log_Level    error
        Parsers_File /fluent-bit/etc/parsers.conf
        Parsers_File /fluent-bit/etc/conf/custom_parsers.conf
        HTTP_Server  On
        HTTP_Listen  0.0.0.0
        HTTP_Port    2020
        Health_Check On

  inputs: |
    [INPUT]
        Name              tail
        Path              /var/log/containers/*.log
        # 시스템/인프라 namespace를 파일경로 수준에서 차단 (가장 확실한 방법)
        # 컨테이너 로그 파일명 형식: <pod>_<namespace>_<container>-<hash>.log
        Exclude_Path      /var/log/containers/*_kube-system_*,/var/log/containers/*_kube-public_*,/var/log/containers/*_kube-node-lease_*,/var/log/containers/*_argocd_*,/var/log/containers/*_monitoring_*,/var/log/containers/*_external-secrets_*,/var/log/containers/*_batch_*,/var/log/containers/*_argo_*
        multiline.parser  docker, cri
        Tag               kube.*
        Mem_Buf_Limit     5MB
        Skip_Long_Lines   On
        DB                /var/log/flb_kube.db

    # 노드 시스템 로그 — kubelet + containerd 만 수집 (비용 최소화)
    # journald는 /var/log/journal(영구) 또는 /run/log/journal(휘발)에 저장됨 → 둘 다 마운트
    [INPUT]
        Name              systemd
        Tag               host.*
        Systemd_Filter    _SYSTEMD_UNIT=kubelet.service
        Systemd_Filter    _SYSTEMD_UNIT=containerd.service
        Read_From_Tail    On
        Strip_Underscores On
        DB                /var/log/flb_systemd.db

  filters: |
    [FILTER]
        Name                kubernetes
        Match               kube.*
        Kube_URL            https://kubernetes.default.svc:443
        Merge_Log           On
        Keep_Log            Off
        K8S-Logging.Parser  On
        K8S-Logging.Exclude On
        Annotations         Off

    # K8s pod의 app 레이블을 service_name으로 추출 (Loki primary label)
    # Label_Keys로 직접 추출 불가 (labels가 중첩 map) → Lua로 top-level 필드로 올림
    [FILTER]
        Name    lua
        Match   kube.*
        script  /fluent-bit/scripts/extract_service_name.lua
        call    extract_service_name

    # K8s liveness/readiness probe 제외
    [FILTER]
        Name    grep
        Match   kube.*
        Exclude log kube-probe

    # HTTP health check 경로 제외
    [FILTER]
        Name    grep
        Match   kube.*
        Exclude log (?i)(?:GET|POST|HEAD)\s+\S*(?:health|healthz|readyz|livez|ready|live|ping|metrics|actuator)

    # 빈 줄 제외
    [FILTER]
        Name    grep
        Match   kube.*
        Exclude log ^\s*$

  outputs: |
    [OUTPUT]
        Name            loki
        Match           kube.*
        Host            loki
        Port            3100
        # Labels: 정적 라벨 (Prometheus 형식)
        # Label_Keys: kubernetes 메타데이터에서 동적 추출 (labels['app']은 map이라 제외)
        Labels          job=fluent-bit, cluster=acme-main-v2-prd, env=prd
        Label_Keys      $namespace,$pod,$container,$service_name
        Line_Format     json
        Retry_Limit     False

    # 노드 시스템 로그 → 별도 job 라벨. Strip_Underscores로 _SYSTEMD_UNIT → SYSTEMD_UNIT
    [OUTPUT]
        Name            loki
        Match           host.*
        Host            loki
        Port            3100
        Labels          job=node-systemd, cluster=acme-main-v2-prd, env=prd
        Label_Keys      $HOSTNAME,$SYSTEMD_UNIT
        Line_Format     json
        Retry_Limit     False

  customParsers: ""

luaScripts:
  extract_service_name.lua: |
    function extract_service_name(tag, timestamp, record)
        local service = "unknown"
        if record["kubernetes"] then
            local k8s = record["kubernetes"]
            -- top-level로 올려서 Loki 레이블명에 kubernetes_ 접두사 제거
            record["namespace"] = k8s["namespace_name"]
            record["pod"]       = k8s["pod_name"]
            record["container"] = k8s["container_name"]
            if k8s["labels"] then
                local labels = k8s["labels"]
                service = labels["app.kubernetes.io/name"]
                       or labels["app"]
                       or k8s["container_name"]
                       or "unknown"
            end
        end
        record["service_name"] = service
        return 1, timestamp, record
    end

resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 192Mi

# journald 접근을 위한 호스트 마운트 (차트 기본값 덮어쓰기 → 전체 명시)
daemonSetVolumes:
  - name: varlog
    hostPath:
      path: /var/log
  - name: varlibdockercontainers
    hostPath:
      path: /var/lib/docker/containers
  - name: runlogjournal
    hostPath:
      path: /run/log/journal
  - name: etcmachineid
    hostPath:
      path: /etc/machine-id
      type: File

daemonSetVolumeMounts:
  - name: varlog
    mountPath: /var/log
  - name: varlibdockercontainers
    mountPath: /var/lib/docker/containers
    readOnly: true
  - name: runlogjournal
    mountPath: /run/log/journal
    readOnly: true
  - name: etcmachineid
    mountPath: /etc/machine-id
    readOnly: true

# DaemonSet으로 모든 노드에 배포 (Karpenter nodepool 전체 커버)
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: karpenter.sh/nodepool
              operator: In
              values:
                - base
                - mall-v4-batch
                - mall-v3
                - mall-v4
                - service
                - airflow

# 톨러레이션 추가 (모든 노드 그룹 커버)
tolerations:
  - key: node-group-type
    value: base
    effect: NoSchedule
    operator: Equal
  - key: node-group-type
    value: service
    effect: NoSchedule
    operator: Equal
  - key: node-group-type
    value: mall-v3
    effect: NoSchedule
    operator: Equal
  - key: node-group-type
    value: mall-v4
    effect: NoSchedule
    operator: Equal
  - key: node-group-type
    value: mall-v4-batch
    effect: NoSchedule
    operator: Equal
  - key: node-group-type
    value: airflow
    effect: NoSchedule
    operator: Equal

rbac:
  create: true
  nodeAccess: false
  eventsAccess: false

serviceAccount:
  create: true

serviceMonitor:
  enabled: false
