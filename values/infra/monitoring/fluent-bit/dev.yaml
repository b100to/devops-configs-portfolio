# =============================================================================
# Fluent Bit — dev
# -----------------------------------------------------------------------------
# Alloy를 대체하는 경량 로그 수집기. 로그 전용(log-only)이므로 Fluent Bit가 적합.
# Pipeline: Pod logs → K8s enrichment → namespace/noise 필터 → Loki
# =============================================================================

logLevel: error

config:
  service: |
    [SERVICE]
        Daemon       Off
        Flush        1
        Log_Level    error
        Parsers_File /fluent-bit/etc/parsers.conf
        Parsers_File /fluent-bit/etc/conf/custom_parsers.conf
        HTTP_Server  On
        HTTP_Listen  0.0.0.0
        HTTP_Port    2020
        Health_Check On

  inputs: |
    [INPUT]
        Name              tail
        Path              /var/log/containers/*.log
        # 시스템/인프라 namespace를 파일경로 수준에서 차단 (가장 확실한 방법)
        # 컨테이너 로그 파일명 형식: <pod>_<namespace>_<container>-<hash>.log
        Exclude_Path      /var/log/containers/*_kube-system_*,/var/log/containers/*_kube-public_*,/var/log/containers/*_kube-node-lease_*,/var/log/containers/*_argocd_*,/var/log/containers/*_monitoring_*,/var/log/containers/*_external-secrets_*,/var/log/containers/*_batch_*,/var/log/containers/*_argo_*
        multiline.parser  docker, cri
        Tag               kube.*
        Mem_Buf_Limit     5MB
        Skip_Long_Lines   On
        DB                /var/log/flb_kube.db

  filters: |
    [FILTER]
        Name                kubernetes
        Match               kube.*
        Kube_URL            https://kubernetes.default.svc:443
        Merge_Log           On
        Keep_Log            Off
        K8S-Logging.Parser  On
        K8S-Logging.Exclude On
        Annotations         Off

    # K8s pod의 app 레이블을 service_name으로 추출 (Loki primary label)
    # Label_Keys로 직접 추출 불가 (labels가 중첩 map) → Lua로 top-level 필드로 올림
    [FILTER]
        Name    lua
        Match   kube.*
        script  /fluent-bit/scripts/extract_service_name.lua
        call    extract_service_name

    # K8s liveness/readiness probe 제외
    [FILTER]
        Name    grep
        Match   kube.*
        Exclude log kube-probe

    # HTTP health check 경로 제외
    [FILTER]
        Name    grep
        Match   kube.*
        Exclude log (?i)(?:GET|POST|HEAD)\s+\S*(?:health|healthz|readyz|livez|ready|live|ping|metrics|actuator)

    # 빈 줄 제외
    [FILTER]
        Name    grep
        Match   kube.*
        Exclude log ^\s*$

  outputs: |
    [OUTPUT]
        Name            loki
        Match           kube.*
        Host            loki
        Port            3100
        # Labels: 정적 라벨 (Prometheus 형식)
        # Label_Keys: kubernetes 메타데이터에서 동적 추출 (labels['app']은 map이라 제외)
        Labels          job=fluent-bit, cluster=acme-main-v2-dev, env=dev
        Label_Keys      $namespace,$pod,$container,$service_name
        Line_Format     json
        Retry_Limit     False

  customParsers: ""

luaScripts:
  extract_service_name.lua: |
    function extract_service_name(tag, timestamp, record)
        local service = "unknown"
        if record["kubernetes"] then
            local k8s = record["kubernetes"]
            -- top-level로 올려서 Loki 레이블명에 kubernetes_ 접두사 제거
            record["namespace"] = k8s["namespace_name"]
            record["pod"]       = k8s["pod_name"]
            record["container"] = k8s["container_name"]
            if k8s["labels"] then
                local labels = k8s["labels"]
                service = labels["app.kubernetes.io/name"]
                       or labels["app"]
                       or k8s["container_name"]
                       or "unknown"
            end
        end
        record["service_name"] = service
        return 1, timestamp, record
    end

resources:
  requests:
    cpu: 20m
    memory: 50Mi
  limits:
    cpu: 200m
    memory: 128Mi

tolerations:
  - key: node-group-type
    operator: Equal
    value: mall-v4-batch
    effect: NoSchedule

rbac:
  create: true
  nodeAccess: false
  eventsAccess: false

serviceAccount:
  create: true
