replicaCount: 2
clusterName: acme-main-prd
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: aws-load-balancer-controller
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
    minDomains: 2
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: aws-load-balancer-controller
serviceAccount:
  create: true
  name: aws-load-balancer-controller
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::222222222222:role/eks-pod-identity-aws-load-balancer-controller-v2"
region: ap-northeast-2
vpcId: vpc-0000000000000001
resources:
  requests:
    cpu: 15m
    memory: 50Mi
  limits:
    cpu: 50m
    memory: 80Mi
