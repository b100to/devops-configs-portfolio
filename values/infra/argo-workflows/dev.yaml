# =============================================================================
# Argo Workflows - Development
# SSO: Authentik OIDC (https://sso.acme.example/application/o/argo-workflows/)
# Ingress: Traefik IngressRoute (manifests/traefik/dev/infra.yaml)
# =============================================================================

controller:
  # batch 네임스페이스 등 멀티 네임스페이스 실행 시 기본 SA 지정
  # batch-rbac.yaml에서 각 네임스페이스에 argo-workflow SA를 생성해야 함
  workflowDefaults:
    spec:
      serviceAccountName: argo-workflow
  resources:
    requests:
      cpu: 25m # Kubecost 7d avg 17m / 0.7
      memory: 46Mi # Kubecost 7d avg 32Mi / 0.7
    limits:
      cpu: 500m
      memory: 512Mi

server:
  authModes:
    - sso
  sso:
    enabled: true
    issuer: https://sso.acme.example/application/o/argo-workflows/
    clientId:
      name: argo-server-sso
      key: client-id
    clientSecret:
      name: argo-server-sso
      key: client-secret
    redirectUrl: https://argo-workflows.dev.acme.example/oauth2/callback
    scopes:
      - openid
      - profile
      - email
    sessionExpiry: "10h"
    rbac:
      enabled: true  # SSO 사용자는 아래 extraObjects의 argo-workflows-admin SA로 매핑
  ingress:
    enabled: false  # Traefik IngressRoute 별도 사용 (manifests/traefik/dev/infra.yaml)
  resources:
    requests:
      cpu: 10m # Kubecost 7d avg 1m / 0.7 (min 10m)
      memory: 32Mi # Kubecost 7d avg 8Mi / 0.7 (min 32Mi)
    limits:
      cpu: 300m
      memory: 256Mi

# SSO RBAC: 모든 인증된 SSO 사용자를 admin으로 매핑
extraObjects:
  - apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: argo-workflows-admin
      namespace: argo
      annotations:
        workflows.argoproj.io/rbac-rule: "true"  # 모든 SSO 사용자 매칭
        workflows.argoproj.io/rbac-rule-precedence: "1"
  - apiVersion: v1
    kind: Secret
    metadata:
      name: argo-workflows-admin.service-account-token
      namespace: argo
      annotations:
        kubernetes.io/service-account.name: argo-workflows-admin
    type: kubernetes.io/service-account-token
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRoleBinding
    metadata:
      name: argo-workflows-admin-sso
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: ClusterRole
      name: argo-workflows-admin
    subjects:
      - kind: ServiceAccount
        name: argo-workflows-admin
        namespace: argo
