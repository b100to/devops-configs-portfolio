#https://artifacthub.io/packages/helm/bitnami/kafka
global:
  security:
    allowInsecureImages: true
image:
  # Bitnami가 2025-08 public.ecr.aws/bitnami 이미지를 삭제 → 노드 교체 시 ImagePullBackOff.
  # bitnamilegacy(Docker Hub)로 전환 + 태그 고정(chart 32.4.3 default).
  registry: docker.io
  repository: bitnamilegacy/kafka
  tag: 4.0.0-debian-12-r10

## Kafka 클러스터 설정
controller:
  replicaCount: 1
  controllerOnly: false # 통합 모드 (controller+broker)
  resourcesPreset: "medium"
  nodeSelector:
    node-group-type: base
  persistence:
    size: 50Gi
  pdb:
    create: false # Pod Disruption Budget 비활성화
# clusterId: "" # 정상 노드에서 가져온 클러스터 ID 설정

broker:
  replicaCount: 0 # 추가 브로커 없이 controller만 사용

## TLS 설정 (개발 환경에서는 비활성화)
tls:
  enabled: false
  autoGenerated:
    enabled: false

## 외부 접근 설정 (개발 환경에서는 비활성화)
externalAccess:
  enabled: false

## 메트릭 설정
metrics:
  jmx:
    enabled: false

listeners:
  client:
    protocol: PLAINTEXT
  controller:
    protocol: PLAINTEXT
  interbroker:
    protocol: PLAINTEXT
  external:
    protocol: PLAINTEXT

sasl:
  enabled: false
  # client:
  #   users:
  #     - user1
  #   passwords:
  #     - "MyFixedPassword123" # 고정된 비밀번호 설정
  # interbroker:
  #   user: inter_broker_user
  #   password: "MyInterBrokerPassword123" # 고정된 비밀번호 설정
  # controller:
  #   user: controller_user
  #   password: "MyControllerPassword123" # 고정된 비밀번호 설정
  # # 비밀번호 자동 생성 비활성화
  # existingSecret: ""

# 추가 중요 설정
auth:
  enabled: false
  # # 비밀번호 자동 생성 비활성화
  # autoGeneratePassword: false

## 프로비저닝 설정
provisioning:
  enabled: true
  topics:
    - name: events
    - name: logs
    - name: notifications
  nodeSelector:
    node-group-type: base
