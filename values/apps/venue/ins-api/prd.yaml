# =============================================================================
# Venue Insurance API - Production Environment
# =============================================================================
global:
  env: prd
  registry:
    accountId: "222222222222"
    region: "ap-northeast-2"

# =============================================================================
# Application
# =============================================================================
fullnameOverride: ins-api

# Namespace (없으면 자동 생성)
namespace:
  name: venue

# =============================================================================
# Image
# =============================================================================
image:
  repository: sc-ins-prod
  tag: latest
  pullPolicy: IfNotPresent

# =============================================================================
# Service Account
# =============================================================================
# app-venue SA는 Pod Identity 사용 중 → aws-sdk-kotlin 구버전 호환 불가 (169.254.170.23 거부)
# ins-api 전용 SA + IRSA로 분리하여 AWS_ROLE_ARN / AWS_WEB_IDENTITY_TOKEN_FILE 방식 사용
serviceAccount:
  create: true
  name: ins-api
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::222222222222:role/irsa-ins-api-prd

# =============================================================================
# Deployment
# =============================================================================
replicaCount: 1

priorityClassName: medium-high-priority

labels:
  env: prd

# =============================================================================
# Service
# =============================================================================
service:
  enabled: true
  type: ClusterIP
  port: 80
  targetPort: 8083

# =============================================================================
# Health Checks
# =============================================================================
startupProbe:
  enabled: true
  httpGet:
    path: /whoami
    port: http
  initialDelaySeconds: 30
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 10
  successThreshold: 1

livenessProbe:
  enabled: true
  httpGet:
    path: /whoami
    port: http
  initialDelaySeconds: 30
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 10
  successThreshold: 1

readinessProbe:
  enabled: true
  httpGet:
    path: /whoami
    port: http
  initialDelaySeconds: 30
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 10
  successThreshold: 1

# =============================================================================
# Resources
# =============================================================================
resources:
  requests:
    cpu: 59m  # Kubecost 7d avg 35.6m / 0.6
    memory: 1000Mi
  limits:
    memory: 2200Mi

# =============================================================================
# Autoscaling
# =============================================================================
autoscaling:
  enabled: false

# =============================================================================
# Environment Variables
# =============================================================================
env:
  # Spring
  - name: SPRING_PROFILES_ACTIVE
    value: prod
  - name: DD_TRACING_ENABLED
    value: "true"
  - name: DD_TRACE_ENABLED
    value: "true"
  # DD_SERVICE, DD_ENV, DD_VERSION, DD_LOGS_INJECTION, DD_TRACE_SAMPLE_RATE, DD_TRACE_AGENT_URL
  # -> 차트 템플릿(app.datadogEnv)에서 자동 주입됨
  - name: DD_DOGSTATSD_URL
    value: "unix:///var/run/datadog/dsd.socket"
  - name: DD_PROFILING_ENABLED
    value: "true"
  - name: DD_PROFILING_DDPROF_CPU_ENABLED
    value: "true"

# =============================================================================
# AWS
# =============================================================================
aws:
  enabled: true
  region: ap-northeast-2

envFrom: []

# =============================================================================
# Datadog
# =============================================================================
datadog:
  enabled: true


# =============================================================================
# Scheduling
# =============================================================================
# 멀티 AZ 이중화를 위한 topologySpread 활성화
defaultTopologySpread:
  enabled: true
