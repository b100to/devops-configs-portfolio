# =============================================================================
# Venue Beacon API - Development Environment
# =============================================================================
global:
  env: dev
  registry:
    accountId: "111111111111"
    region: "ap-northeast-2"

# =============================================================================
# Application
# =============================================================================
fullnameOverride: studio-admin-django

# Namespace (없으면 자동 생성)
namespace:
  name: venue

# =============================================================================
# Image
# =============================================================================
image:
  repository: partner-django-admin-dev
  tag: latest
  pullPolicy: IfNotPresent

# =============================================================================
# Service Account
# =============================================================================
serviceAccount:
  create: false
  name: app-venue
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::111111111111:role/eks-pod-identity-app-venue-v2

# =============================================================================
# Deployment
# =============================================================================
# replicaCount: 1

priorityClassName: high-priority

labels:
  env: dev

# =============================================================================
# Service
# =============================================================================
service:
  enabled: true
  type: ClusterIP
  port: 80
  targetPort: 8000

# =============================================================================
# Health Checks
# =============================================================================
livenessProbe:
  enabled: true
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 30
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 10
  successThreshold: 1

readinessProbe:
  enabled: true
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 30
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 10
  successThreshold: 1

# =============================================================================
# Resources
# =============================================================================
resources:
  requests:
    cpu: 15m # Kubecost 7d avg 10m / 0.7
    memory: 1000Mi
  limits:
    memory: 1000Mi

# =============================================================================
# Autoscaling
# =============================================================================
autoscaling:
  enabled: false

# =============================================================================
# Environment Variables
# =============================================================================
env:
  - name: DD_TRACE_ENABLED
    value: "false"
  - name: DJANGO_ENV
    value: dev

# envFrom:
#   - secretRef:
#       name: aws-account

# =============================================================================
# AWS
# =============================================================================
aws:
  enabled: true
  region: ap-northeast-2

# =============================================================================
# Datadog
# =============================================================================
datadog:
  enabled: false

# =============================================================================
# Scheduling
# =============================================================================
# 단일 AZ 환경이므로 topologySpread 비활성화
topologySpreadConstraints: []
