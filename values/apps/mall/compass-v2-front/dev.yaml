# =============================================================================
# Acme Compass v2 Front - Development Environment
# nginx 정적 프론트. 이미지에 API_UPSTREAM(acme-compass-v2 svc)이 내장되어 /api를 백엔드로 프록시함
# =============================================================================
global:
  env: dev
  registry:
    accountId: "111111111111"
    region: "ap-northeast-2"

# =============================================================================
# Application
# =============================================================================
fullnameOverride: acme-compass-v2-front

namespace:
  name: mall

# =============================================================================
# Image
# =============================================================================
# tag는 ArgoCD Image Updater(newest-build)가 갱신 (write-back: argocd)
image:
  repository: acme/compass-v2-front
  tag: latest
  pullPolicy: Always # 앱 CI가 고유 태그를 push하기 전까지 latest 재배포 대비

# =============================================================================
# Service Account
# =============================================================================
# 정적 프론트라 AWS 권한 불필요 → default SA 사용
serviceAccount:
  create: false
  name: default

# =============================================================================
# Deployment
# =============================================================================
labels:
  env: dev

# =============================================================================
# Service
# =============================================================================
# 외부 노출 없음 (ClusterIP만, IngressRoute 없음). 도메인 노출 시 IngressRoute + company-ip-allowlist 추가
service:
  enabled: true
  type: ClusterIP
  port: 80
  targetPort: 80

# =============================================================================
# Health Checks
# =============================================================================
# nginx 헬스 엔드포인트 /healthz (200 확인)
livenessProbe:
  enabled: true
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 15
  timeoutSeconds: 3
  failureThreshold: 3
  successThreshold: 1

readinessProbe:
  enabled: true
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 15
  timeoutSeconds: 3
  failureThreshold: 3
  successThreshold: 1

startupProbe:
  enabled: false

# =============================================================================
# Resources (nginx 정적 서빙 기준 소량)
# =============================================================================
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 128Mi

# =============================================================================
# Autoscaling
# =============================================================================
autoscaling:
  enabled: false

# =============================================================================
# Environment Variables
# =============================================================================
env: []

envFrom: []

# =============================================================================
# AWS
# =============================================================================
aws:
  enabled: false

# =============================================================================
# Datadog
# =============================================================================
datadog:
  enabled: false

# =============================================================================
# Scheduling
# =============================================================================
# 단일 AZ 환경이므로 topologySpread 비활성화
topologySpreadConstraints: []
