# =============================================================================
# Mall V4 Batch - Dev Environment Values
# =============================================================================
# 이 파일은 ArgoCD Application에서 backend repo의 values와 병합됩니다.
# backend repo (mall/batch/helm/dev.yaml)에는 app: {} 아래의 job 정의들이 있습니다.
# =============================================================================

commonValues:
  # =============================================================================
  # Global & Environment
  # =============================================================================
  global:
    env: dev
    registry:
      accountId: "111111111111"
      region: "ap-northeast-2"

  fullnameOverride: ""

  # =============================================================================
  # Namespace
  # =============================================================================
  namespace:
    name: mall

  # =============================================================================
  # Image Configuration
  # =============================================================================
  image:
    repository: acmemall-backend-v4/dev/batch
    tag: "1a89c0a-3726" # 기존 tag로 업데이트
    pullPolicy: IfNotPresent

  # =============================================================================
  # Service Account
  # =============================================================================
  serviceAccount:
    name: app-mall

  # =============================================================================
  # Resources
  # =============================================================================
  resources:
    requests:
      cpu: 500m
      memory: 950Mi
    limits:
      cpu: 800m
      memory: 1Gi

  # =============================================================================
  # Environment Variables
  # =============================================================================
  envFrom: []

  # =============================================================================
  # Priority
  # =============================================================================
  priorityClassName: low-priority

  # =============================================================================
  # Karpenter 통합 - NodePool 스케줄링 (base로 통합)
  # =============================================================================
  nodeSelector:
    karpenter.sh/nodepool: base

  tolerations: []

  # affinity: {}  # 필요시 추가
# =============================================================================
# Individual CronJobs
# =============================================================================
# Backend repo와의 구조 호환성 문제로 인해 DevOps repo에서 직접 관리
# TODO: Backend repo 구조 수정 후 backend repo로 이관

# 단일 AZ 환경이므로 topologySpread 비활성화
topologySpreadConstraints: []
